name: Update images.json

# Runs automatically whenever files change inside images/, and can also
# be triggered manually from the Actions tab if you ever need to re-run it.
on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-images-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          echo "[" > images.json
          first=true
          for f in images/*.{jpg,jpeg,png,gif,JPG,JPEG,PNG,GIF}; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images.json
            fi
            printf '  "%s"' "$name" >> images.json
          done
          echo "" >> images.json
          echo "]" >> images.json
          cat images.json

      - name: Commit updated images.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --staged --quiet || git commit -m "Auto-update images.json"
          git push
